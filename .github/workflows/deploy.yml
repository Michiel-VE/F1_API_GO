name: Deploy F1 API

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: f1-api
  TF_WORKING_DIR: infra

permissions:
  id-token: write   # required for OIDC auth to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- AWS auth via OIDC (no long-lived keys stored in GitHub) ---
      # One-time setup required: create an IAM role that trusts
      # GitHub's OIDC provider (token.actions.githubusercontent.com)
      # and grants it permission to push to ECR + run this Terraform.
      # Store its ARN as the AWS_DEPLOY_ROLE_ARN secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Unique tag per commit -- this is what makes the whole pipeline
      # work with zero manual steps. Terraform's image_uri variable
      # changes on every single deploy, so `terraform apply` always
      # detects a diff, updates the Lambda function, publishes a new
      # version (publish = true), and moves the alias to it -- all
      # automatically, exactly as your aws_lambda_alias resource
      # already expects.
      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          docker build --provenance=false \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          terraform apply -auto-approve \
            -var="image_uri=${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"