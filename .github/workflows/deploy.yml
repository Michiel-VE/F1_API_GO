name: Deploy F1 API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once (two terraform applies would fight over state).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: f1-api
  TF_WORKING_DIR: infra

jobs:
  # Runs on every push AND every pull request. A failure here stops the deploy.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # Unique tag per commit so terraform image_uri changes and updates the Lambda alias.
      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          docker build --platform linux/amd64 --provenance=false \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          TF_VAR_aws_account_id:       ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_db_username:          ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password:          ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_url:               ${{ secrets.DB_URL }}
          TF_VAR_google_client:        ${{ secrets.GOOGLE_CLIENT }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_secret_key:       ${{ secrets.JWT_SECRET_KEY }}
          TF_VAR_upstash_redis_token:  ${{ secrets.UPSTASH_REDIS_TOKEN }}
          TF_VAR_upstash_redis_url:    ${{ secrets.UPSTASH_REDIS_URL }}
          TF_VAR_github_org:           Michiel-VE
          TF_VAR_github_repo:          F1_API_GO
          TF_VAR_github_org_id:        "57892007"
          TF_VAR_github_repo_id:       "1343393933"
        run: |
          terraform apply -auto-approve \
            -var="image_uri=${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"